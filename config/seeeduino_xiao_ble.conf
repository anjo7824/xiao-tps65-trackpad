CONFIG_ZMK_POINTING=y
CONFIG_BT_DEVICE_NAME="XIAO Trackpad"
CONFIG_ZMK_BLE_INIT_PRIORITY=40
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
CONFIG_I2C=y
CONFIG_INPUT=y
# Aktivera USB Serial / Virtual COM Port för loggning
CONFIG_ZMK_USB_LOGGING=y

# (Valfritt) Fördröj loggningen vid start så att du hinner ansluta och se boot-loggar
CONFIG_LOG_PROCESS_THREAD_START_STARTUP_DELAY_MS=8000
