CONFIG_ZMK_POINTING=y
CONFIG_BT_DEVICE_NAME="XIAO Trackpad"
CONFIG_ZMK_BLE_INIT_PRIORITY=40
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
CONFIG_I2C=y
CONFIG_INPUT=y
# Aktivera seriekommunikation och USB-loggning
CONFIG_SERIAL=y
CONFIG_ZMK_USB_LOGGING=y

# Valfri fördröjning av loggutskrift vid uppstart (korrekt Zephyr 3.5.0-symbol)
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
